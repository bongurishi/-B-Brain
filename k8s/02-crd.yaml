apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: remediationpolicies.bbrain.ai
spec:
  group: bbrain.ai
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              properties:
                targetResource:
                  type: string
                anomalyThresholdParams:
                  type: object
                  properties:
                    cpuPercent:
                      type: integer
                    consecutiveMinutes:
                      type: integer
                allowedActions:
                  type: array
                  items:
                    type: string
                requiresApproval:
                  type: boolean
  scope: Namespaced
  names:
    plural: remediationpolicies
    singular: remediationpolicy
    kind: RemediationPolicy
    shortNames:
      - rp
