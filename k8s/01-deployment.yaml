apiVersion: apps/v1
kind: Deployment
metadata:
  name: b-brain-control-plane
  namespace: b-brain-system
  labels:
    app: b-brain
    component: control-plane
spec:
  replicas: 1
  selector:
    matchLabels:
      app: b-brain
      component: control-plane
  template:
    metadata:
      labels:
        app: b-brain
        component: control-plane
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3000"
        prometheus.io/path: "/metrics"
    spec:
      containers:
      - name: b-brain-os
        image: acme-corp/b-brain-os:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3000
          name: http
        env:
        - name: NODE_ENV
          value: "production"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: b-brain-secrets
              key: gemini-api-key
        resources:
          requests:
            cpu: 500m
            memory: 512Mi
          limits:
            cpu: 1000m
            memory: 1Gi
        livenessProbe:
          httpGet:
            path: /metrics
            port: 3000
          initialDelaySeconds: 15
          periodSeconds: 20
---
apiVersion: v1
kind: Service
metadata:
  name: b-brain-service
  namespace: b-brain-system
  labels:
    app: b-brain
    component: control-plane
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: b-brain
    component: control-plane
